server:
  port: 8083

spring:
  datasource:
    url: jdbc:h2:mem:rikkei_account_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: redis
    redis:
      time-to-live: 300000 # 5 minutes
